<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para minha melhor amiga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container animate__animated animate__fadeInDown">
        <h1 class="animate__animated animate__pulse animate__infinite">Para [Nome Dela] ✨</h1>
        
        <div class="coracao animate__animated animate__heartBeat animate__infinite">❤️</div>

        <p class="fade-in-text">Você é a melhor amiga que alguém poderia ter.</p>
        
        <div class="mensagem">
            <p>"Nossa amizade é como um código sem bugs: perfeita!"</p>
        </div>

        <button id="botaoSurpresa">Clica aqui!</button>
        
        <div id="confetes"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
