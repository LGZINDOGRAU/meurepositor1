<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Profissional | Portfólio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cursor-glow"></div>

    <main class="container">
        <header class="profile-header">
            <div class="avatar-container">
                <img src="https://github.com/LGZINDOGRAU.png" alt="Sua Foto" class="avatar">
            </div>
            <h1>LUIS GABRIEL KROESSIN</h1>
            <p class="subtitle">Desenvolvedor Full Stack | UI/UX Designer</p>
        </header>

        <section class="links-container">
            <a href="#" class="link-card">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
                <small>Veja meus repositórios</small>
            </a>
            <a href="#" class="link-card">
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
                <small>Conecte-se comigo</small>
            </a>
            <a href="#" class="link-card highlight">
                <i class="fa-solid fa-rocket"></i>
                <span>Meu Portfólio</span>
                <small>Projetos em destaque</small>
            </a>
            <a href="#" class="link-card">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
                <small>Bastidores e Design</small>
            </a>
        </section>

        <footer>
            <p>© 2024 • Desenvolvido com ❤️</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
